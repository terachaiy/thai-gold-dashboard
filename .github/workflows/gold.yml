name: Update gold dashboard

on:
  schedule:
    - cron: "*/30 1-11 * * *"   # every 30 min, 08:00-18:59 Bangkok (GTA price rounds)
    - cron: "15 23 * * *"       # 06:15 Bangkok, after the US session closes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gold-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # News history, collected GTA quotes, price CSVs and backtest results persist between runs.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: data
          key: gold-state-${{ github.run_id }}
          restore-keys: gold-state-

      - name: Build site
        env:
          TZ: Asia/Bangkok
          PYTHONIOENCODING: utf-8
        run: python export_static.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: gold-state-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
